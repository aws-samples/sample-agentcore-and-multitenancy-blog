AWSTemplateFormatVersion: '2010-09-09'
Description: 'API Gateway with throttling for AgentCore multitenancy'

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda code
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda code zip file
    Default: api_gateway_lambda.zip
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for JWT verification
    Default: ''
  CognitoClientId:
    Type: String
    Description: Cognito Client ID for JWT audience verification
    Default: ''

Resources:
  # Lambda Function
  AgentCoreProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: agentcore-api-gateway-proxy
      Runtime: python3.12
      Handler: api_gateway_lambda.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # CloudWatch Logs role for API Gateway (account-level setting)
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn: AgentCoreApiGateway
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # API Gateway
  AgentCoreApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: agentcore-multitenant-api
      Description: API Gateway for AgentCore with tenant throttling
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  AgentCoreResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AgentCoreApiGateway
      ParentId: !GetAtt AgentCoreApiGateway.RootResourceId
      PathPart: 'runtimes'

  AgentArnResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AgentCoreApiGateway
      ParentId: !Ref AgentCoreResource
      PathPart: '{proxy+}'

  # API Gateway Method
  AgentCoreMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AgentCoreApiGateway
      ResourceId: !Ref AgentArnResource
      HttpMethod: POST
      AuthorizationType: None
      ApiKeyRequired: true  # Enable API key requirement
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentCoreProxyLambda.Arn}/invocations'

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentCoreProxyLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AgentCoreApiGateway}/*/*'

  # API Gateway Deployment
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: AgentCoreMethod
    Properties:
      RestApiId: !Ref AgentCoreApiGateway

  # CloudWatch Log Group for API Gateway access logs
  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AgentCoreApiGateway}/access-logs'
      RetentionInDays: 30

  # API Gateway Stage
  ApiGatewayStage:
    DependsOn: ApiGatewayAccount
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref AgentCoreApiGateway
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: prod
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'

  # Usage Plans for demo - very low limits to show throttling
  PremiumUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiGatewayStage
    Properties:
      UsagePlanName: premium-tier-demo
      Description: Premium tier for demo - higher limits
      Throttle:
        RateLimit: 2    # 2 requests per second
        BurstLimit: 5   # 5 burst requests
      Quota:
        Limit: 20       # 20 requests per day
        Period: DAY
      ApiStages:
        - ApiId: !Ref AgentCoreApiGateway
          Stage: !Ref ApiGatewayStage

  BasicUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiGatewayStage
    Properties:
      UsagePlanName: basic-tier-demo
      Description: Basic tier for demo - very low limits
      Throttle:
        RateLimit: 0.5  # 1 request per 2 seconds
        BurstLimit: 2   # 2 burst requests
      Quota:
        Limit: 5        # 5 requests per day
        Period: DAY
      ApiStages:
        - ApiId: !Ref AgentCoreApiGateway
          Stage: !Ref ApiGatewayStage

  # API Keys for tenants
  PremiumApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: premium-tenant-key
      Description: API Key for premium tenants
      Enabled: true

  BasicApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: basic-tenant-key
      Description: API Key for basic tenants
      Enabled: true

  # Link API Keys to Usage Plans
  PremiumUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref PremiumApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref PremiumUsagePlan

  BasicUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref BasicApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref BasicUsagePlan

  # NOTE: API Key SSM parameters are created by scripts/fix_api_key_ssm.sh
  # after stack deployment. CloudFormation's !Ref on ApiKey returns the
  # resource ID, not the actual secret key value needed for x-api-key header.

  # SSM Parameter for API Gateway URL
  ApiGatewayUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/agentcore/api_gateway_url
      Type: String
      Value: !Sub 'https://${AgentCoreApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Description: API Gateway URL for healthcare AgentCore
      Tags:
        Application: Healthcare

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${AgentCoreApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayUrl'
  PremiumApiKeyId:
    Description: Premium API Key Resource ID (use get-api-key --include-value for actual key)
    Value: !Ref PremiumApiKey
  BasicApiKeyId:
    Description: Basic API Key Resource ID (use get-api-key --include-value for actual key)
    Value: !Ref BasicApiKey
