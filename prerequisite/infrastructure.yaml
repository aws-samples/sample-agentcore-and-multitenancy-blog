AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for HealthCare AI System with DynamoDB tables, SSM parameters, and synthetic data"
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Lambda Code Configuration
        Parameters:
          - LambdaS3Bucket
          - LambdaS3Key

Parameters:
  LambdaS3Bucket:
    Description: The name of S3 bucket which contains lambda code
    Type: String
    MinLength: 1

  LambdaS3Key:
    Description: The S3 object key which contains Healthcare AI assistant code in zip format
    Type: String
    MinLength: 1

Resources:
  RuntimeAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Application
          Value: HealthcareDemo
        - Key: project
          Value: HealthcareMultiTenant
        - Key: cost-center
          Value: HC-AgentCore
        - Key: Environment
          Value: demo
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/BedrockAgentCoreFullAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock-agentcore-healthcare*
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/healthcare*
              - Sid: ProvisionedThroughputModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*
              - Sid: SSMGetparam
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/healthcare/*
              - Sid: Identity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/healthcare*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/healthcare*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
              - Sid: SecretManager
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/oauth2/healthcare*
              - Sid: AgentCoreMemoryReadOnly
                Effect: Allow
                Action:
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:GetMemory
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/healthcare*
              - Sid: AssumeMemoryTvmRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-MemoryTvmRole
              - Sid: BedrockKnowledgeBaseAccess
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              - Sid: NovaWebGroundingAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeTool
                Resource:
                  - arn:aws:bedrock:*:*:system-tool/amazon.nova_grounding
              - Sid: InvokeGateway
                Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeGateway
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
              - Sid: BedrockMantleAccess
                Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock-mantle:CallWithBearerToken
                  - bedrock-mantle:GetProject
                  - bedrock-mantle:ListProjects
                Resource:
                  - !Sub arn:aws:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*
                  - "*"

  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt HealthCareAILambda.Arn
              - Sid: PolicyEngineAccess
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetPolicyEngine
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:policy-engine/*
              - Sid: PolicyEngineAuthorization
                Effect: Allow
                Action:
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:PartiallyAuthorizeActions
                  - bedrock-agentcore:CheckAuthorizePermissions
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:policy-engine/*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*

  # TVM (Token Vending Machine) role for ABAC-scoped memory access.
  # The agent execution role assumes this role per-request with session tags
  # (Tier, ClinicId, UserId). The ABAC policy conditions ensure each tenant
  # can only access their own actorId and namespace in memory.
  MemoryTvmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-MemoryTvmRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt RuntimeAgentCoreRole.Arn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              StringLike:
                aws:RequestTag/Tier: "?*"
                aws:RequestTag/ClinicId: "?*"
                aws:RequestTag/UserId: "?*"
      Policies:
        - PolicyName: AbacMemoryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AbacActorIdScope
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/healthcare*
                Condition:
                  StringLike:
                    bedrock-agentcore:actorId: "${aws:PrincipalTag/Tier}-${aws:PrincipalTag/ClinicId}-${aws:PrincipalTag/UserId}"
              - Sid: AbacNamespaceScope
                Effect: Allow
                Action:
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:GetMemoryRecord
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/healthcare*
                Condition:
                  StringLike:
                    bedrock-agentcore:namespace: "clinic/${aws:PrincipalTag/Tier}-${aws:PrincipalTag/ClinicId}-${aws:PrincipalTag/UserId}/*"

  # KMS key for DynamoDB table encryption
  HealthcareTableKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for healthcare DynamoDB tables
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowLambdaDecrypt
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/service-role/*

  HealthcareTableKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-dynamodb-key
      TargetKeyId: !Ref HealthcareTableKey

  # Healthcare Tables
  PatientMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-PatientMetadata"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt HealthcareTableKey.Arn
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: clinic_id
          AttributeType: S
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: clinic-index
          KeySchema:
            - AttributeName: clinic_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: Healthcare
        - Key: CostCenter
          Value: Healthcare

  ClinicConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-ClinicConfig"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt HealthcareTableKey.Arn
      AttributeDefinitions:
        - AttributeName: clinic_id
          AttributeType: S
      KeySchema:
        - AttributeName: clinic_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: Healthcare
        - Key: CostCenter
          Value: Healthcare

  # Lambda target for healthcare tools
  HealthCareAILambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: HealthcareTablesAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSendToDLQ
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt HealthCareAILambdaDLQ.Arn

              - Sid: AllowReadHealthcareTableNamesFromSSM
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/healthcare/dynamodb/patient_metadata_table_name
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/healthcare/dynamodb/clinic_config_table_name

              - Sid: AllowReadPatientMetadataTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PatientMetadataTable}

              - Sid: AllowReadPatientMetadataIndexes
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PatientMetadataTable}/index/*

              - Sid: AllowReadClinicConfigTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClinicConfigTable}

              - Sid: AllowKMSDecryptForDynamoDB
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt HealthcareTableKey.Arn

  # DLQ for Lambda failure capture
  HealthCareAILambdaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-LambdaDLQ"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  HealthCareAILambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda function for Healthcare AI Assistant"
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt HealthCareAILambdaRole.Arn
      Runtime: python3.12
      PackageType: Zip
      Architectures:
        - x86_64
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt HealthCareAILambdaDLQ.Arn
      Environment:
        Variables:
          PATIENT_METADATA_TABLE: !Ref PatientMetadataTable
          CLINIC_CONFIG_TABLE: !Ref ClinicConfigTable

  # SSM Parameters for Healthcare Tables
  PatientMetadataTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/dynamodb/patient_metadata_table_name
      Type: String
      Value: !Ref PatientMetadataTable
      Description: DynamoDB table name for patient metadata
      Tags:
        Application: Healthcare

  ClinicConfigTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/dynamodb/clinic_config_table_name
      Type: String
      Value: !Ref ClinicConfigTable
      Description: DynamoDB table name for clinic configurations
      Tags:
        Application: Healthcare

  GatewayAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/agentcore/gateway_iam_role
      Type: String
      Value: !GetAtt GatewayAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: Healthcare

  RuntimeAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/agentcore/runtime_iam_role
      Type: String
      Value: !GetAtt RuntimeAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: Healthcare

  MemoryTvmRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/memory/tvm_role_arn
      Type: String
      Value: !GetAtt MemoryTvmRole.Arn
      Description: TVM role ARN for ABAC-scoped memory access
      Tags:
        Application: Healthcare

  LambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/healthcare/agentcore/lambda_arn
      Type: String
      Value: !GetAtt HealthCareAILambda.Arn
      Description: ARN of the lambda that integrates with agentcore
      Tags:
        Application: Healthcare
