# Configuration Template for Multi-Tenant AgentCore Deployment
# This file will be populated during deployment with account-specific values

# AWS Account Configuration
aws:
  account_id: "${AWS_ACCOUNT_ID}"
  region: "${AWS_REGION}"
  
# Inference Profiles (will be created during deployment)
inference_profiles:
  basic:
    arn: "arn:aws:bedrock:${AWS_REGION}:${AWS_ACCOUNT_ID}:application-inference-profile/${BASIC_PROFILE_ID}"
  premium:
    arn: "arn:aws:bedrock:${AWS_REGION}:${AWS_ACCOUNT_ID}:application-inference-profile/${PREMIUM_PROFILE_ID}"

# Cognito Configuration (will be created during deployment)
cognito:
  user_pool_id: "${COGNITO_USER_POOL_ID}"
  client_id: "${COGNITO_CLIENT_ID}"
  discovery_url: "https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/openid-configuration"

# AgentCore Configuration (will be populated after agent creation)
agents:
  basic:
    name: "customersupport-basic"
    agent_id: "${BASIC_AGENT_ID}"
    agent_arn: "arn:aws:bedrock-agentcore:${AWS_REGION}:${AWS_ACCOUNT_ID}:runtime/${BASIC_AGENT_ID}"
  premium:
    name: "customersupport-premium"
    agent_id: "${PREMIUM_AGENT_ID}"
    agent_arn: "arn:aws:bedrock-agentcore:${AWS_REGION}:${AWS_ACCOUNT_ID}:runtime/${PREMIUM_AGENT_ID}"

# IAM Roles (will be created during deployment)
iam:
  execution_role: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE_NAME}"
  codebuild_role: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${CODEBUILD_ROLE_NAME}"

# ECR Repositories
ecr:
  basic_repository: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/bedrock-agentcore-customersupport-basic"
  premium_repository: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/bedrock-agentcore-customersupport-premium"

# Knowledge Bases (will be created during deployment)
knowledge_bases:
  basic:
    id: "${BASIC_KB_ID}"
    name: "customersupport-basic-kb"
  premium:
    id: "${PREMIUM_KB_ID}"
    name: "customersupport-premium-kb"