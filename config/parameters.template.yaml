# Configuration Template for Multi-Tenant AgentCore Deployment
# Populated during deployment by scripts/configure_deployment.py

aws:
  account_id: "${AWS_ACCOUNT_ID}"
  region: "${AWS_REGION}"

# Bedrock Projects (created by scripts/create_bedrock_projects.py)
# Projects use the Mantle (OpenAI-compatible) endpoint for cost attribution.
# Each tier has a dedicated project whose tags flow into AWS Cost Explorer.
bedrock_projects:
  basic:
    id: "${BASIC_PROJECT_ID}"
    name: "Healthcare-Basic"
  premium:
    id: "${PREMIUM_PROJECT_ID}"
    name: "Healthcare-Premium"

# Bedrock API Key (for Mantle endpoint authentication)
bedrock_api_key_ssm: "/app/healthcare/bedrock_api_key"

# Cognito Configuration (created by prerequisite/cognito_multitenant.yaml)
cognito:
  user_pool_id: "${COGNITO_USER_POOL_ID}"
  client_id: "${COGNITO_CLIENT_ID}"
  discovery_url: "https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/openid-configuration"

# AgentCore Agents (created by agentcore configure + deploy)
agents:
  basic:
    name: "healthcare_basic"
    agent_id: "${BASIC_AGENT_ID}"
    agent_arn: "arn:aws:bedrock-agentcore:${AWS_REGION}:${AWS_ACCOUNT_ID}:runtime/${BASIC_AGENT_ID}"
  premium:
    name: "healthcare_premium"
    agent_id: "${PREMIUM_AGENT_ID}"
    agent_arn: "arn:aws:bedrock-agentcore:${AWS_REGION}:${AWS_ACCOUNT_ID}:runtime/${PREMIUM_AGENT_ID}"

# IAM Roles (created by prerequisite/infrastructure.yaml)
iam:
  execution_role: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${EXECUTION_ROLE_NAME}"

# Knowledge Bases (created by prerequisite/knowledge_base.py)
knowledge_bases:
  basic:
    id: "${BASIC_KB_ID}"
    name: "healthcare-basic-kb"
  premium:
    id: "${PREMIUM_KB_ID}"
    name: "healthcare-premium-kb"
